# 反向代理。三条路径，三种不同的要求。

server {
  listen 80;
  server_name _;
  # webhook 带密钥，明文 HTTP 等于密钥裸奔。内网也要上 TLS
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl;
  http2 on;
  server_name _;

  ssl_certificate     /etc/nginx/certs/fullchain.pem;
  ssl_certificate_key /etc/nginx/certs/privkey.pem;

  # access log 默认不记 body —— **保持默认**。
  # body 里可能有用户 id、手机号、业务数据；真要排查走 /api/runs/{id}，
  # 那里受权限控制且经过脱敏
  access_log /var/log/nginx/access.log;

  # 前端静态站点 + SPA 回退
  location / {
    auth_basic "Workflow control plane";
    auth_basic_user_file /run/secrets/control_htpasswd;
    root /usr/share/nginx/html;
    try_files $uri /index.html;
  }

  # 节点服务的控制面接口。它们不在 /api 下，不能落进 SPA 回退。
  location = /health {
    auth_basic "Workflow control plane";
    auth_basic_user_file /run/secrets/control_htpasswd;
    proxy_pass http://api:8791;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location ~ ^/(registry|options|nodes)/ {
    auth_basic "Workflow control plane";
    auth_basic_user_file /run/secrets/control_htpasswd;
    proxy_pass http://api:8791;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-User $remote_user;
    # http.request 节点本身最多允许 120 秒。
    proxy_read_timeout 130s;
  }

  # 控制面。编辑器调用，带 SSO 用户名
  location /api/ {
    auth_basic "Workflow control plane";
    auth_basic_user_file /run/secrets/control_htpasswd;
    # 不带尾斜杠，保留后端真实的 /api/... 路径。
    proxy_pass http://api:8791;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    # 审计的 actor 从这里来。服务端不自己做认证
    proxy_set_header X-Forwarded-User $remote_user;
    proxy_read_timeout 130s;
  }

  # Webhook 入口。认证方式和 /api 完全不同（token 在路径、密钥在头）
  location /hooks/ {
    proxy_pass http://api:8791/hooks/;
    proxy_set_header Host $host;
    # 限流依赖真实来源 IP
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # 和服务端的 MAX_BODY_BYTES 对齐。在这里挡掉更省 —— 大 body 根本不进 Python
    client_max_body_size 1m;
    # 必须大于 responseMode=lastNode 可配置的 1800 秒上限
    proxy_read_timeout 1810s;
  }
}
